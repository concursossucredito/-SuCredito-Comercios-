<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Sucrédito Comercios</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head><body><header><a href="../index-v2.html" class="brand"><span>»»</span> SUCRÉDITO <small>ADMIN COMERCIOS</small></a><button id="logout" hidden>Cerrar sesión</button></header><main><section id="login" class="panel login"><h1>Ingresar al panel</h1><p>Acceso exclusivo para usuarios autorizados.</p><label>Email<input id="email" type="email" autocomplete="username" placeholder="tu@email.com"></label><label>Contraseña<input id="password" type="password" autocomplete="current-password"></label><button id="loginBtn" class="primary">Ingresar</button><p id="loginMsg" class="msg"></p></section><section id="app" hidden><div class="intro"><div><p class="eyebrow">Panel privado</p><h1>Administrar comercios</h1><p>Los cambios se guardan directamente en la base de datos de desarrollo.</p></div><a href="../index-v2.html" class="link">Ver página ↗</a></div><nav class="tabs"><button class="tab active" data-tab="merchants">Comercios</button><button class="tab" data-tab="categories">Categorías</button></nav><section id="merchantTab" class="workspace"><div class="panel"><div class="panelHead"><h2>Listado</h2><button id="newMerchant" class="primary">+ Nuevo comercio</button></div><input id="search" class="field" placeholder="Buscar comercio…"><div id="merchantList" class="merchantList"></div></div><form id="merchantForm" class="panel"><h2 id="formTitle">Nuevo comercio</h2><input id="merchantId" type="hidden"><label>Nombre<input id="name" required maxlength="120"></label><label>Categoría<select id="category" required></select></label><label>URL del logo<input id="logo" type="url" placeholder="https://…"></label><label>Descripción<textarea id="description" rows="3"></textarea></label><label>Localidades separadas por coma<input id="localities" placeholder="Tucumán, Salta"></label><label>Cuotas separadas por coma<input id="quotas" placeholder="General: 3, 6; Tucumán: 3, 5"></label><label>Orden<input id="order" type="number" value="0"></label><label class="check"><input id="active" type="checkbox" checked> Publicado</label><div class="actions"><button type="button" id="clearForm">Limpiar</button><button class="primary" type="submit">Guardar comercio</button></div><p id="merchantMsg" class="msg"></p></form></section><section id="categoryTab" class="panel" hidden><h2>Categorías</h2><form id="categoryForm" class="categoryForm"><input id="categoryName" required placeholder="Nombre de la categoría"><input id="categorySlug" required placeholder="slug-categoria"><input id="categoryOrder" type="number" value="0" placeholder="Orden"><button class="primary">Agregar categoría</button></form><div id="categoryList" class="categoryList"></div><p id="categoryMsg" class="msg"></p></section><p id="appMsg" class="msg"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script src="admin.js"></script></body></html>
