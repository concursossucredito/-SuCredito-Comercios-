<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sucrédito · Todo por ella</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --yellow:#FFEE00;
    --red:#E30613;
    --ink:#1B1A1E;
    --ink-soft:#4A4850;
    --paper:#FFFDF6;
    --line:rgba(27,26,30,0.12);
    --topbar-h: 70px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h2{font-family:'Archivo Black','Inter',sans-serif;font-weight:400;letter-spacing:-0.01em;}

  /* —— Fondo amarillo de entrada —— */
  .intro-fondo{
    position:fixed;
    inset:0;
    z-index:90;
    background:var(--yellow);
    pointer-events:none;
    animation:salidaFondo 1.6s ease forwards;
  }
  @keyframes salidaFondo{
    0%, 55%{ opacity:1; }
    100%{ opacity:0; visibility:hidden; }
  }

  /* —— TOPBAR FIJO (solo el logo) – siempre visible —— */
  .topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:100;
    background:#fff;
    border-bottom:6px solid var(--yellow);
    padding:12px 24px;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:var(--topbar-h);
  }
  .topbar img{
    display:block;
    height:46px;
    width:auto;
    max-width:80%;
    transform-origin:center center;
    /* Aparece grande en el centro → se acomoda en el topbar */
    animation:logoDesdeCentro 1.6s cubic-bezier(.22,.8,.28,1) both;
    will-change:transform, opacity;
  }
  @keyframes logoDesdeCentro{
    0%{
      opacity:1;
      transform: translateY(38vh) scale(2.35);
    }
    50%{
      opacity:1;
      transform: translateY(0) scale(1.08);
    }
    72%{
      transform: translateY(0) scale(0.96);
    }
    100%{
      opacity:1;
      transform: translateY(0) scale(1);
    }
  }
  @media (prefers-reduced-motion: reduce){
    .topbar img{ animation:none; opacity:1; transform:none; will-change:auto; }
    .intro-fondo{ display:none; }
  }

  /* —— Hero: scrollea normal y se oculta —— */
  .hero-wrap{
    background:var(--yellow);
    display:flex;
    justify-content:center;
    margin-top: var(--topbar-h);
  }
  .hero-banner{
    display:block;
    width:100%;
    max-width:1000px;
    height:auto;
  }

  /* —— Controles de localidad —— */
  .controls{
    max-width:1080px;
    margin:0 auto;
    padding:22px 24px 6px;
  }
  .label{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--ink-soft);
    font-weight:700;
    margin-bottom:12px;
  }
  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .tab{
    appearance:none;
    border:2px solid var(--ink);
    background:var(--paper);
    color:var(--ink);
    padding:11px 18px;
    border-radius:12px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    transition:transform .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .tab:hover{
    transform:translateY(-2px);
    box-shadow:0 4px 12px rgba(0,0,0,.08);
  }
  .tab:focus-visible{
    outline:3px solid var(--red);
    outline-offset:2px;
  }
  .tab.active{
    background:var(--yellow);
    border-color:var(--yellow);
    box-shadow:0 2px 8px rgba(0,0,0,.1);
  }
  .tab .count{
    font-weight:500;
    opacity:.7;
    font-size:12.5px;
    margin-left:6px;
  }

  /* —— Contenido principal —— */
  main{
    max-width:1080px;
    margin:0 auto;
    padding:18px 24px 90px;
  }
  .heading{
    display:flex;
    align-items:baseline;
    flex-wrap:wrap;
    gap:14px;
    margin:8px 0 4px;
  }
  .heading h2{
    font-size:clamp(1.8rem,4vw,2.8rem);
    margin:0;
  }
  .heading .sub{
    color:var(--ink-soft);
    font-size:14.5px;
  }

  .groups{
    display:flex;
    flex-direction:column;
    gap:16px;
    margin-top:18px;
  }
  .group{
    display:flex;
    align-items:center;
    gap:18px;
    padding:14px 16px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    transition:box-shadow .2s ease;
  }
  .group:hover{
    box-shadow:0 6px 20px rgba(0,0,0,.06);
  }
  .logos{
    flex:1;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
    justify-content:center;
    min-width:0;
  }
  .logo{
    flex:1 1 150px;
    max-width:240px;
    height:96px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid var(--line);
    border-radius:12px;
    padding:8px 12px;
    background:#fff;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .logo:hover{
    transform:translateY(-3px);
    box-shadow:0 6px 16px rgba(0,0,0,.08);
  }
  .logo img{
    max-width:100%;
    max-height:80px;
    object-fit:contain;
    display:block;
  }
  .logo .fallback{
    font-family:'Archivo Black',sans-serif;
    font-size:16px;
    text-align:center;
    line-height:1.1;
    color:var(--ink);
  }

  /* —— Placa de cuotas —— */
  .plate{
    flex:0 0 140px;
    width:140px;
    background:#fff;
    border-radius:14px;
    padding:8px 6px 8px;
    text-align:center;
    box-shadow:0 2px 7px rgba(0,0,0,.14);
    border-bottom:5px solid var(--yellow);
  }
  .plate .num{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:2px;
    background:var(--red);
    color:#fff;
    font-family:'Archivo Black',sans-serif;
    font-size:2.5rem;
    line-height:1;
    height:54px;
    min-width:68px;
    padding:0 10px;
    border-radius:12px 18px 12px 18px;
  }
  .plate .num small{
    font-size:.9rem;
    margin:0 2px;
    position:relative;
    top:-.55rem;
  }
  .plate .txt{
    font-family:'Archivo Black',sans-serif;
    font-size:14px;
    line-height:1.05;
    margin-top:5px;
    letter-spacing:-0.02em;
  }

  /* —— Mobile: más compacto (se ven 2 promociones) —— */
  @media (max-width:700px){
    :root{ --topbar-h: 56px; }
    .topbar{ padding:8px 16px; }
    .topbar img{ height:34px; }

    .controls{ padding:16px 16px 4px; }
    .tab{ padding:9px 14px; font-size:13.5px; }

    main{ padding:12px 16px 70px; }
    .heading h2{ font-size:1.7rem; }
    .groups{ gap:12px; margin-top:12px; }

    .group{
      flex-direction:column;
      gap:10px;
      padding:12px;
    }
    .plate{
      flex-basis:auto;
      width:130px;
    }
    .plate .num{ font-size:2.2rem; height:48px; min-width:60px; }
    .plate .txt{ font-size:13px; }

    .logo{
      flex-basis:120px;
      height:78px;
      padding:6px 10px;
    }
    .logo img{ max-height:64px; }
  }

  footer{
    background:var(--yellow);
    color:var(--ink);
    padding:22px 24px;
    font-size:13px;
    line-height:1.55;
    text-align:center;
    font-weight:600;
  }

  .groups.fade-out{ opacity:0; transform:translateY(6px); transition:opacity .15s ease, transform .15s ease; }
  .groups.fade-in{ opacity:1; transform:translateY(0); transition:opacity .22s ease, transform .22s ease; }
</style>
</head>
<body>
<div class="intro-fondo" aria-hidden="true"></div>

<!-- Solo el logo queda FIJO arriba -->
<header class="topbar" id="topbar">
  <img src="logo.png" alt="Tarjeta Sucrédito" id="logo">
</header>

<!-- Hero: se oculta al scrollear -->
<div class="hero-wrap">
  <img src="hero_banner.jpg" alt="Todo por ella · Tarjeta Sucrédito" class="hero-banner" id="heroBanner">
</div>

<div class="controls">
  <div class="label">Elegí tu localidad</div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Localidades"></div>
</div>

<main>
  <div class="heading">
    <h2 id="title">—</h2>
    <span class="sub" id="sub"></span>
  </div>
  <div class="groups" id="groups"></div>
</main>

<footer>
  Tarjeta Sucrédito propiedad de Valle Fértil S.A, Cuit 30-68570941-0 — San Martín 836, San Miguel de Tucumán.<br>
  *CFT (Costo Financiero Total) 0,0% — TNA (Tasa Nominal Anual) 0,0%.
</footer>

<script>
/* Cada comercio: [archivo del logo, nombre (se usa si falta la imagen)] */
const L = {
  nico:["nico.png","Nico"], rossetti:["rossetti.png","Rossetti"], on_city:["on_city.png","On City"], naldo:["naldo.png","Naldo"],
  tecno_compro:["tecno_compro.png","Tecno Compro"], riiing:["riiing.png","Riiing"],
  marathon:["marathon.png","Marathon"], noraly:["noraly.png","Noraly"], minou:["minou.png","Minou"],
  juanita_jo:["juanita_jo.png","Juanita Jo"], ver:["ver.png","Ver"], del_pueblo:["del_pueblo.png","Del Pueblo Farmacias"],
  avenida:["avenida.png","Avenida"], mauri_deportes:["mauri_deportes.png","Mauri Deportes"], narcisa:["narcisa.png","Narcisa"],
  ibanez:["ibañez.png","Ibañez"], pampero:["pampero.png","Pampero"], elegant:["elegant.png","Elegant"], urbano:["urbano.png","Urbano"],
  balbi:["balbi.png","Balbi"], la_marroquineria:["la_marroquineria.png","La Marroquinería"], divinas:["divinas.png","Divinas"],
  tendencia:["tendencia.png","Tendencia"], valentino:["valentino.png","Valentino"],
  luciri:["luciri.png","Luciri"], tabu:["tabu.png","Tabú"], reina_mora:["reina_mora.png","Reina Mora"], gravedad_zero:["gravedad_zero.png","Gravedad Zero"],
  yandi_deportes:["yandi_deportes.png","Yandi Deportes"], stile_kapirosa:["stile_kapirosa.png","Stile Kapirosa"],
  ambar:["ambar.png","Ámbar"], euforia:["euforia.png","Euforia"], que_bonito:["que_bonito.png","Qué Bonito"], zenihe:["zenihe.png","Zenihe"],
  terravisione:["terravisione.png","Terravisione"],
  optica_nanni:["optica_nanni.png","Óptica Nanni"], piruchas:["piruchas.png","Piruchas"], lucho:["lucho.png","Lucho"],
  sc_deportes:["sc_deportes.png","SC Deportes"], horizonte:["horizonte.png","Horizonte"], lyh_deportes:["lyh_deportes.png","LyH Deportes"],
  silvana_joyas:["silvana_joyas.png","Silvana Joyas"], optica_santa_lucia:["optica_santa_lucia.png","Óptica Santa Lucía"],
  bonafide:["bonafide.png","Bonafide"], kiss_gift_shop:["kiss_gift_shop.png","Kiss Gift Shop"],
  laura_valentinuz_joyas:["laura_valentinuz_joyas.png","Laura Valentinuz Joyas"],
  joyeria_hama:["joyeria_hama.png","Joyería Hama"], deolinda:["deolinda.png","Deolinda"], venivestite:["venivestite.png","Venivestite"],
  milenium:["milenium.png","Milenium"], monticelli:["monticelli.png","Monticelli"]
};

const DATA = {
  COR:  {name:"Córdoba", groups:[["3 y 6",["nico","rossetti"]],["6 y 9",["on_city","naldo"]],["6",["tecno_compro","riiing"]]]},
  TUC:  {name:"Tucumán", groups:[["5",["marathon"]],["6",["noraly","minou"]],["8",["juanita_jo"]],["5 y 8",["ver"]],["6 y 9",["del_pueblo"]]]},
  ORAN: {name:"Orán", groups:[["3",["avenida","mauri_deportes","narcisa"]],["5",["ibanez","pampero","elegant","urbano"]]]},
  SAL:  {name:"Salta", groups:[["5",["marathon","balbi","la_marroquineria","divinas"]],["6",["tendencia","valentino"]]]},
  SANP: {name:"San Pedro", groups:[["3",["luciri","tabu","reina_mora","gravedad_zero"]],["5",["yandi_deportes"]],["3 y 6",["stile_kapirosa"]]]},
  CONC: {name:"Concepción", groups:[["5",["marathon","ambar","euforia"]],["6",["que_bonito","zenihe"]],["5 y 7",["terravisione"]]]},
  BANDA:{name:"La Banda", groups:[["3",["optica_nanni","piruchas"]],["6",["lucho","sc_deportes","horizonte","lyh_deportes"]]]},
  JUJ:  {name:"Jujuy", groups:[["3",["silvana_joyas","optica_santa_lucia","bonafide","balbi"]],["6",["kiss_gift_shop"]],["3 y 6",["laura_valentinuz_joyas"]]]},
  SGO:  {name:"Santiago", groups:[["12",["joyeria_hama"]],["9",["deolinda"]],["6",["venivestite","milenium","monticelli"]]]}
};

const $ = id => document.getElementById(id);
const count = loc => loc.groups.reduce((n,g) => n + g[1].length, 0);

function plateHtml(c){
  const num = c.split(" y ").join("<small>y</small>");
  return `<div class="plate"><div class="num">${num}</div><div class="txt">Cuotas<br>sin interés</div></div>`;
}
function logoHtml(k){
  const [file,name] = L[k];
  return `<span class="logo"><img src="${file}" alt="${name}" data-name="${name}" onerror="logoFail(this)"></span>`;
}
function logoFail(img){
  const d = document.createElement('div');
  d.className = 'fallback';
  d.textContent = img.dataset.name;
  img.replaceWith(d);
}

function render(key){
  const loc = DATA[key], n = count(loc);
  const groupsEl = $('groups');

  groupsEl.classList.remove('fade-in');
  groupsEl.classList.add('fade-out');

  setTimeout(() => {
    $('title').textContent = loc.name;
    $('sub').textContent = n + (n === 1 ? " comercio adherido" : " comercios adheridos");
    groupsEl.innerHTML = loc.groups.map(g =>
      `<div class="group">${plateHtml(g[0])}<div class="logos">${g[1].map(logoHtml).join('')}</div></div>`
    ).join('');
    groupsEl.classList.remove('fade-out');
    groupsEl.classList.add('fade-in');
  }, 150);

  document.querySelectorAll('.tab').forEach(b => {
    const active = b.dataset.key === key;
    b.classList.toggle('active', active);
    b.setAttribute('aria-selected', active);
  });
  history.replaceState(null,'','#'+key.toLowerCase());
}

Object.keys(DATA).forEach(key => {
  const b = document.createElement('button');
  b.className = 'tab';
  b.dataset.key = key;
  b.setAttribute('role','tab');
  b.innerHTML = DATA[key].name + ` <span class="count">${count(DATA[key])}</span>`;
  b.onclick = () => render(key);
  $('tabs').appendChild(b);
});

const h = location.hash.replace('#','').toUpperCase();
render(DATA[h] ? h : 'TUC');

/* Ajuste de altura del topbar fijo */
function updateTopbarHeight(){
  const topbar = document.getElementById('topbar');
  if(!topbar) return;
  document.documentElement.style.setProperty('--topbar-h', topbar.offsetHeight + 'px');
}
const logo = document.getElementById('logo');
if(logo){
  if(logo.complete) updateTopbarHeight();
  else {
    logo.addEventListener('load', updateTopbarHeight);
    logo.addEventListener('error', updateTopbarHeight);
  }
}
window.addEventListener('resize', updateTopbarHeight);
window.addEventListener('load', updateTopbarHeight);
setTimeout(updateTopbarHeight, 200);
setTimeout(updateTopbarHeight, 800);
</script>

</body>
</html>
